<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
        body {
            margin: 0;
           font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url(clearsky.jpg);
            background-repeat: no-repeat;
            background-size: cover;
        }

        .container {
           background-color: #f9f9f9;
            width: 40%;
            height: 70vh;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 {
  
  font-family: 'Poppins', 'Montserrat', sans-serif;
  font-size: 2.1rem;
  color: #2e2d2d;
  margin-top: 20px;
  text-align: center;
        }

        .search-box {
            display: flex; 
             gap: 10px;
        }

        input {
            
  width: 100%;
  max-width: 300px;
  padding: 12px 15px;
  border: 2px solid #4a90e2;   /* soft blue border */
  border-radius: 8px;           /* rounded corners */
  font-family: 'Poppins', sans-serif;
  font-size: 1rem;
  color: #333;
  background-color: #f9f9f9;
  outline: none;
  transition: all 0.3s ease;
  margin: 20px 0;
  
        }

        

        button {
            padding: 12px 15px;
            background: #168df5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #064c97;
        }

    .weather-report {
      margin-top: 30px;
      color: #000000;
      font-size: 20px;
        /* margin-top: 20px; */
  padding: 20px;
  background: #e8f4ff;
  border-radius: 8px;
  height: 160px;
    }

        
        
     </style>
</head>
<body>
    <div class="container">
    <h1>Weather Application</h1>

  <div class="date-time">
    <div id="date"></div>
    <div id="time"></div>
  </div>

    <input type="text" id="city" placeholder="Enter the City Name">
       <br><br>
    <button onclick="getWeather()">Get Weather</button>

    <div class="weather-report" id="result"></div>
    </div>

    <script>
        function updateDateTime() {
      const now = new Date();
      document.getElementById("date").innerText = " Date: " + now.toLocaleDateString();
      document.getElementById("time").innerText = " Time: " + now.toLocaleTimeString();
    }

    updateDateTime();
    setInterval(updateDateTime, 1000);

        async function getWeather() {
            const city = document.getElementById("city").value.trim();
            const apiKey = "b5d29625f8ad4a95a608bde60672ab74";


            if(city === "") {
        alert("Please enter a city name");
        return;
            }

            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

            try{

                const response = await fetch(url);
                const data = await response.json();



            
                if (response.ok){
                
                document.getElementById("result").innerHTML = `
             🌍 ${data.name}, ${data.sys.country}<br>
             🌡️ Temp: ${data.main.temp} °C<br>
             ☁️ Weather: ${data.weather[0].description}<br>
             💧 Humidity: ${data.main.humidity}%<br>
             🌬️ Wind: ${data.wind.speed} m/s`;


                } else{
                    document.getElementById("result").innerHTML = 
                    "City not found!";
                }
            } catch (error){
                document.getElementById("result").innerHTML = 
                "Error fetching weather data.";
            }
            
        }
    </script>
</body>
</html>
